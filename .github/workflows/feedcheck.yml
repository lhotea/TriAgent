name: feedcheck

# Diagnose the FEEDS list from GitHub's network. Feeds are the one part of
# this system that cannot be tested locally or in CI fixtures: URLs rot,
# publishers start blocking bots, and a source that parses but carries nothing
# recent is invisible in a daily run until the posts start repeating.
on:
  workflow_dispatch:
    inputs:
      extra_feeds:
        description: "Candidate feed URLs to probe (comma or newline separated). Not added to FEEDS."
        required: false
        default: ""

jobs:
  feedcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install TriAgent
        run: pip install -e .

      - name: Probe every feed
        env:
          FEEDS: ${{ vars.FEEDS }}
          EXTRA_FEEDS: ${{ inputs.extra_feeds }}
        run: python -m triagent --mode feedcheck

      # Reports the World Triathlon API's actual response shape. The field
      # mapping was written without a reachable host, so this is how it gets
      # confirmed. Non-blocking: a failure here must not mask the feed report.
      - name: Probe the World Triathlon API
        if: always()
        continue-on-error: true
        env:
          WORLD_TRIATHLON_API_KEY: ${{ secrets.WORLD_TRIATHLON_API_KEY }}
          WORLD_TRIATHLON_ENDPOINT: ${{ vars.WORLD_TRIATHLON_ENDPOINT }}
        run: python -m triagent --mode apicheck
