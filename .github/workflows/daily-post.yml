name: daily-post

on:
  schedule:
    # 17:00 UTC. There is no universal "best time" — the honest answer is
    # whenever this account's followers are online, which only its own data can
    # say. This is the best available guess until the insights CSV has enough
    # rows to settle it:
    #
    #   19:00 CEST — European evening, after the session, phone in hand
    #   18:00 BST  — same, UK
    #   13:00 EDT  — US east-coast lunch break
    #
    # It replaces 13:00 UTC, which landed at 15:00 CEST: mid-afternoon, the
    # deadest part of a European weekday.
    #
    # A fixed time cannot be evaluated from its own data — every post shares it,
    # so nothing distinguishes a good hour from a bad one. The CSV now records
    # published_hour_utc and weekday, so rotating this across a few candidate
    # hours would let the numbers name the winner.
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the post but don't publish"
        type: boolean
        default: false

permissions:
  contents: write  # needed to push rendered card to gh-pages

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The headline style depends on a heavy condensed face; without one the
      # renderer falls back to regular bold and the type reads much wider.
      - name: Install fonts and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-extra fonts-liberation ffmpeg

      - name: Install TriAgent
        run: pip install -e .

      # The ledger of already-posted stories lives on gh-pages. Without pulling
      # it first the run would start from empty and repeat everything — the
      # same failure mode the insights CSV has.
      - name: Fetch posted-story history
        run: |
          set -euo pipefail
          mkdir -p assets
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git show origin/gh-pages:posted.json > assets/posted.json 2>/dev/null \
              || echo "no history yet — first run"
          fi

      - name: Build card + caption
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FEEDS: ${{ vars.FEEDS }}
          IMAGE_GEN_API_KEY: ${{ secrets.IMAGE_GEN_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PUBLIC_IMAGE_BASE_URL: ${{ secrets.PUBLIC_IMAGE_BASE_URL }}
          AFFILIATE_URLS: ${{ secrets.AFFILIATE_URLS }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          POST_FORMAT: ${{ vars.POST_FORMAT || 'carousel' }}
          CAROUSEL_SLIDES: ${{ vars.CAROUSEL_SLIDES }}
          REEL_AUDIO: ${{ vars.REEL_AUDIO }}
          REEL_SECONDS: ${{ vars.REEL_SECONDS }}
        run: python -m triagent --mode build

      - name: Publish card to gh-pages
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          test -f assets/daily.png || { echo "card missing"; exit 1; }
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add -B gh-pages gh-pages-wt origin/gh-pages
          else
            git worktree add --orphan -b gh-pages gh-pages-wt
          fi
          # Copy by glob, not by literal name. Assets are published under dated
          # filenames (daily-2026-08-09.png) to defeat CDN caching, and naming
          # each file explicitly here means a change in the Python has to be
          # mirrored in this YAML — which is exactly how run #125 published a
          # card the publisher then waited 300s for and never found.
          cp assets/daily*.png gh-pages-wt/
          cp assets/index.html gh-pages-wt/
          cp assets/daily*.mp4 gh-pages-wt/ 2>/dev/null || true
          # Fail here rather than letting the publisher discover it 300s later.
          ls gh-pages-wt/daily-*.png >/dev/null 2>&1 || {
            echo "no dated card was copied — publish would 404"; exit 1; }
          ls -1 gh-pages-wt/
          cd gh-pages-wt
          git config user.email "actions@github.com"
          git config user.name "TriAgent Bot"
          git add -A
          git commit -m "card: $(date -u +%F)" || echo "no changes"
          git push origin gh-pages

      - name: Publish to Instagram
        if: ${{ !inputs.dry_run }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FEEDS: ${{ vars.FEEDS }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_MODE: ${{ vars.IG_API_MODE || 'instagram_login' }}
          PUBLIC_IMAGE_BASE_URL: ${{ secrets.PUBLIC_IMAGE_BASE_URL }}
          AFFILIATE_URLS: ${{ secrets.AFFILIATE_URLS }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          POST_FORMAT: ${{ vars.POST_FORMAT || 'carousel' }}
          CAROUSEL_SLIDES: ${{ vars.CAROUSEL_SLIDES }}
        run: python -m triagent --mode publish

      # Only after a post is live. Publishing has failed for image hosting,
      # credentials and API quirks before now, and marking stories used on a
      # run that never posted would shrink the pool for nothing.
      - name: Record posted stories
        if: ${{ !inputs.dry_run && success() }}
        run: |
          set -euo pipefail
          test -f assets/posted.json || { echo "nothing committed"; exit 0; }
          git fetch origin gh-pages || true
          git worktree add -B gh-pages gh-pages-hist origin/gh-pages
          cp assets/posted.json gh-pages-hist/posted.json
          cd gh-pages-hist
          git config user.email "actions@github.com"
          git config user.name "TriAgent Bot"
          git add posted.json
          git commit -m "history: $(date -u +%F)" || echo "no changes"
          git push origin gh-pages

      - name: Upload rendered card
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-card
          path: |
            assets/daily.png
            assets/caption.txt
            assets/index.html
            assets/daily.mp4
            assets/posted.json
          if-no-files-found: ignore
