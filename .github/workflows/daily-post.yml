name: daily-post

on:
  schedule:
    # 13:00 UTC = 8am ET / 5am PT — early-morning feed drop before commute.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the post but don't publish"
        type: boolean
        default: false

permissions:
  contents: write  # needed to push rendered card to gh-pages

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install TriAgent
        run: pip install -e .

      - name: Build card + caption
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FEEDS: ${{ vars.FEEDS }}
          PUBLIC_IMAGE_BASE_URL: ${{ secrets.PUBLIC_IMAGE_BASE_URL }}
          AFFILIATE_URLS: ${{ secrets.AFFILIATE_URLS }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
        run: python -m triagent --mode build

      - name: Publish card to gh-pages
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          test -f assets/daily.png || { echo "card missing"; exit 1; }
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add -B gh-pages gh-pages-wt origin/gh-pages
          else
            git worktree add --orphan -b gh-pages gh-pages-wt
          fi
          cp assets/daily.png gh-pages-wt/daily.png
          cp assets/index.html gh-pages-wt/index.html
          cd gh-pages-wt
          git config user.email "actions@github.com"
          git config user.name "TriAgent Bot"
          git add daily.png index.html
          git commit -m "card: $(date -u +%F)" || echo "no changes"
          git push origin gh-pages

      - name: Publish to Instagram
        if: ${{ !inputs.dry_run }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FEEDS: ${{ vars.FEEDS }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_MODE: ${{ vars.IG_API_MODE || 'instagram_login' }}
          PUBLIC_IMAGE_BASE_URL: ${{ secrets.PUBLIC_IMAGE_BASE_URL }}
          AFFILIATE_URLS: ${{ secrets.AFFILIATE_URLS }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
        run: python -m triagent --mode publish

      - name: Upload rendered card
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-card
          path: |
            assets/daily.png
            assets/caption.txt
            assets/index.html
          if-no-files-found: ignore
