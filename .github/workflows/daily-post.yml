name: daily-post

on:
  schedule:
    # 11:17 UTC. This is a *start* signal, not the posting time.
    #
    # GitHub starts scheduled runs late, and by a lot: over 47 posts the median
    # start was 3.0h after the cron time, the 90th percentile 4.8h and the worst
    # 8.3h. A cron set to the posting hour therefore put half the posts after
    # 22:00 Zurich time — outside every window in which this account's followers
    # are active (Insights: 18-21h Sundays and Mondays, 21-00h Tuesdays) — and
    # because every post landed in the same late slot, the data could never say
    # whether the hour mattered.
    #
    # So the run now starts early, builds the post, and holds in the "Wait for
    # the publish slot" step until PUBLISH_AT (default 19:00 Zurich) before
    # anything is published. 11:17 absorbs a start delay of about five and a half
    # hours in summer and six and a half in winter — 91% and 96% of the delays
    # measured. A run that starts later than that simply posts late, as before;
    # one that starts almost on time publishes a little early (the wait is
    # capped at five hours: about 45 minutes early in summer, an hour and three
    # quarters in winter).
    #
    # The minute is off :00 on purpose: GitHub documents the top of the hour as
    # the busiest time to be scheduled.
    #
    # Which days post is POST_DAYS (default Wed,Fri,Sat), a repository variable,
    # so changing it needs no edit to this file.
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the post but don't publish"
        type: boolean
        default: false

permissions:
  contents: write  # needed to push rendered card to gh-pages

# Two live runs must never overlap. A run picks its stories at build time and
# only records them after publishing, and now holds for hours in between — so a
# second run that built during that hold would choose the same stories and post
# them again, which is exactly what the ledger exists to prevent. A manual run
# started during the wait queues behind the scheduled one instead.
#
# Dry runs change nothing, so they get their own group and are never queued
# behind a post that is waiting for its slot.
concurrency:
  group: daily-post-${{ inputs.dry_run == true && 'dry' || 'live' }}
  cancel-in-progress: false

jobs:
  # Decides whether this scheduled run should post today. A job of its own so
  # that a day off shows as a skipped run rather than a red one, and so that
  # none of the steps below needs a guard.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      post: ${{ steps.decide.outputs.post }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install TriAgent
        run: pip install -e .

      # A typo in POST_DAYS / POST_TZ / PUBLISH_AT fails this step, and with it
      # the run, rather than quietly turning into "never post" or "post daily".
      # Manual runs always post: they are somebody asking for a post right now.
      - name: Is today a posting day?
        id: decide
        env:
          POST_DAYS: ${{ vars.POST_DAYS }}
          POST_TZ: ${{ vars.POST_TZ }}
          PUBLISH_AT: ${{ vars.PUBLISH_AT }}
        run: |
          set -euo pipefail
          # stdout is the single `post=...` line; the reason goes to the log.
          python -m triagent --mode gate >> "$GITHUB_OUTPUT"

  post:
    needs: gate
    if: needs.gate.outputs.post == 'true'
    runs-on: ubuntu-latest
    # The run now starts hours before the post and waits for its slot. The
    # wait is capped at five hours (see MAX_WAIT_SECONDS in schedule.py). Every
    # other step carries its own short limit, so a hung checkout or install
    # fails in minutes instead of holding this workflow's concurrency group — and
    # any manual run queued behind it — until this ceiling. GitHub's hard limit
    # for a job is 360.
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: actions/setup-python@v5
        timeout-minutes: 5
        with:
          python-version: "3.12"
          cache: pip

      # The headline style depends on a heavy condensed face; without one the
      # renderer falls back to regular bold and the type reads much wider.
      - name: Install fonts and ffmpeg
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-extra fonts-liberation ffmpeg

      - name: Install TriAgent
        timeout-minutes: 10
        run: pip install -e .

      # The ledger of already-posted stories lives on gh-pages. Without pulling
      # it first the run would start from empty and repeat everything — the
      # same failure mode the insights CSV has.
      - name: Fetch posted-story history
        timeout-minutes: 5
        run: |
          set -euo pipefail
          source .github/scripts/ghpages.sh
          mkdir -p assets
          # `git fetch ... || true` read "GitHub could not be reached" as "there is
          # no gh-pages yet". The run then started from the tracked placeholder
          # ledger — repeating stories — and its copy later overwrote the real
          # ledger on the remote. Only a branch that genuinely does not exist
          # (exit 2) is allowed to mean a first run.
          rc=0
          fetch_gh_pages || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "gh-pages does not exist yet — no history to fetch"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            echo "could not read gh-pages; refusing to start from an empty ledger" >&2
            exit 1
          fi
          if ! git cat-file -e origin/gh-pages:posted.json 2>/dev/null; then
            echo "gh-pages carries no posted.json yet — starting from empty"
            exit 0
          fi
          # Stage to a temp file first. Redirecting straight into the target
          # creates it *before* git runs, so a failed show left a 0-byte ledger
          # that reads as "nothing posted yet" — indistinguishable from a real
          # first run, and it repeats every story without anything looking wrong.
          git show origin/gh-pages:posted.json > "$RUNNER_TEMP/posted.json"
          # Fail loudly on a corrupt ledger rather than silently posting repeats.
          # A missed day is recoverable; an unnoticed stream of duplicates is
          # what this whole mechanism exists to prevent.
          python -c "import json,os; d=json.load(open(os.environ['RUNNER_TEMP']+'/posted.json')); print(f'{len(d)} story url(s) already posted')"
          mv "$RUNNER_TEMP/posted.json" assets/posted.json

      # Built first, hours before the post, so a failure (a dry story pool, a
      # blocked feed) shows up in the early afternoon while there is time to
      # react, instead of at the moment the post was due.
      - name: Build card + caption
        timeout-minutes: 10
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FEEDS: ${{ vars.FEEDS }}
          IMAGE_GEN_API_KEY: ${{ secrets.IMAGE_GEN_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PUBLIC_IMAGE_BASE_URL: ${{ secrets.PUBLIC_IMAGE_BASE_URL }}
          AFFILIATE_URLS: ${{ secrets.AFFILIATE_URLS }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          POST_FORMAT: ${{ vars.POST_FORMAT || 'carousel' }}
          CAROUSEL_SLIDES: ${{ vars.CAROUSEL_SLIDES }}
          REEL_AUDIO: ${{ vars.REEL_AUDIO }}
          REEL_SECONDS: ${{ vars.REEL_SECONDS }}
        run: python -m triagent --mode build

      # Hold until the audience is online. Placed AFTER the build and BEFORE the
      # push to gh-pages on purpose: every write to gh-pages then happens in the
      # few minutes around publishing. Pushing the card first and waiting
      # afterwards would leave a worktree hours stale, and the insights workflow
      # (which also writes gh-pages) would very likely have pushed in between —
      # so the ledger push at the end would be rejected.
      #
      # Only scheduled runs wait; a manual run publishes immediately.
      - name: Wait for the publish slot
        if: ${{ !inputs.dry_run }}
        env:
          POST_TZ: ${{ vars.POST_TZ }}
          PUBLISH_AT: ${{ vars.PUBLISH_AT }}
        run: python -m triagent --mode wait

      - name: Publish card to gh-pages
        if: ${{ !inputs.dry_run }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          source .github/scripts/ghpages.sh
          test -f assets/daily.png || { echo "card missing"; exit 1; }
          # The worktree is based on a fetch made just now, and the push re-syncs
          # and retries if another workflow wrote in between. This step used to
          # fall back to whatever ref had been cached at the start of the job —
          # hours old, now that the run waits for its slot — and fail with a
          # rejected push, so the post never went out.
          open_gh_pages_worktree
          apply_card() {
            # Copy by glob, not by literal name. Assets are published under
            # dated filenames (daily-2026-08-09.png) to defeat CDN caching, and
            # naming each file explicitly here means a change in the Python has
            # to be mirrored in this YAML — which is exactly how run #125
            # published a card the publisher then waited 300s for and never
            # found. (Runs inside gh-pages-wt, hence the ../assets paths.)
            cp ../assets/daily*.png .
            cp ../assets/index.html .
            cp ../assets/daily*.mp4 . 2>/dev/null || true
            # Fail here rather than letting the publisher discover it 300s later.
            ls daily-*.png >/dev/null 2>&1 || {
              echo "no dated card was copied — publish would 404" >&2
              return 1
            }
          }
          gh_pages_commit_and_push "card: $(date -u +%F)" apply_card

      - name: Publish to Instagram
        if: ${{ !inputs.dry_run }}
        timeout-minutes: 15
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FEEDS: ${{ vars.FEEDS }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_MODE: ${{ vars.IG_API_MODE || 'instagram_login' }}
          PUBLIC_IMAGE_BASE_URL: ${{ secrets.PUBLIC_IMAGE_BASE_URL }}
          AFFILIATE_URLS: ${{ secrets.AFFILIATE_URLS }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          POST_FORMAT: ${{ vars.POST_FORMAT || 'carousel' }}
          CAROUSEL_SLIDES: ${{ vars.CAROUSEL_SLIDES }}
        run: python -m triagent --mode publish

      # Only after a post is live. Publishing has failed for image hosting,
      # credentials and API quirks before now, and marking stories used on a
      # run that never posted would shrink the pool for nothing.
      - name: Record posted stories
        if: ${{ !inputs.dry_run && success() }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          source .github/scripts/ghpages.sh
          test -f assets/posted.json || { echo "nothing committed"; exit 0; }
          # Reuse the worktree the publish step created. Git refuses to check
          # the same branch out into two worktrees, so adding a second one here
          # fails with exit 128 — which is exactly what happened on run #133:
          # the post went out and the history was never recorded.
          open_gh_pages_worktree
          # The ledger on gh-pages is the BASE; this run's entries are added to
          # it. Copying the run's file over it is only right if that file holds
          # everything the published one does — and it does not when the fetch
          # at the start of the run failed (it held the tracked placeholder), or
          # when the run waited hours. Copying then shrank a 40-entry ledger to
          # 4, and the verify step below still reported success.
          apply_ledger() {
            python -c "from pathlib import Path; from triagent.history import merge_ledger; merge_ledger(Path('posted.json'), Path('../assets/posted.json'))"
          }
          if ! gh_pages_commit_and_push "history: $(date -u +%F)" apply_ledger; then
            # By now the post is live. Say so, because the obvious reaction to a
            # red run is "re-run failed jobs", and that would publish again.
            echo "::error::The post is ALREADY LIVE but its stories were not recorded. Do NOT re-run this job: it would publish again. Add these URLs to posted.json on the gh-pages branch by hand:"
            python -c "import json; print(chr(10).join(json.load(open('assets/pending.json'))))" || true
            exit 1
          fi

      # The seam between Python and YAML has now broken three times: run #125
      # (dated files never copied), run #133 (worktree collision), and the
      # duplicate posts of 15–17 Aug, where the ledger was never written at all
      # and every step still reported success. The test suite cannot see across
      # this boundary, so assert the end state on the remote instead of trusting
      # that a sequence of green steps produced it.
      - name: Verify the ledger landed on gh-pages
        if: ${{ !inputs.dry_run && success() }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          source .github/scripts/ghpages.sh
          test -f assets/pending.json || { echo "no stories were selected"; exit 0; }
          fetch_gh_pages
          git show origin/gh-pages:posted.json > "$RUNNER_TEMP/remote-posted.json"
          python - <<'PY'
          import json, os, sys

          pending = json.load(open("assets/pending.json"))
          remote = json.load(open(os.environ["RUNNER_TEMP"] + "/remote-posted.json"))
          missing = [u for u in pending if u not in remote]
          if missing:
              sys.exit(
                  "ledger did not land on gh-pages — these would be posted again "
                  "tomorrow:\n  " + "\n  ".join(missing)
              )
          print(f"verified {len(pending)} story url(s) recorded; {len(remote)} in ledger")
          PY

      - name: Upload rendered card
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: daily-card
          path: |
            assets/daily.png
            assets/daily-*.png
            assets/post-tag.txt
            assets/caption.txt
            assets/index.html
            assets/daily.mp4
            assets/posted.json
            assets/pending.json
          if-no-files-found: ignore
