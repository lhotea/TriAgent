name: daily-post

on:
  schedule:
    # 13:00 UTC = 8am ET / 5am PT — early-morning feed drop before commute.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the post but don't publish"
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run TriAgent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_IMAGE_BASE_URL: ${{ secrets.PUBLIC_IMAGE_BASE_URL }}
          LINK_IN_BIO_URL: ${{ secrets.LINK_IN_BIO_URL }}
          AFFILIATE_URLS: ${{ secrets.AFFILIATE_URLS }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
        run: |
          python -m triagent ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload rendered card
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-card
          path: assets/daily.png
          if-no-files-found: ignore
