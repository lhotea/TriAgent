name: daily-post

on:
  schedule:
    # 13:00 UTC = 8am ET / 5am PT — early-morning feed drop before commute.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the post but don't publish"
        type: boolean
        default: false

permissions:
  contents: write  # needed to push rendered carousel to gh-pages

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install aigent
        run: pip install -e .

      - name: Build carousel + caption
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUBLIC_IMAGE_BASE_URL: ${{ secrets.PUBLIC_IMAGE_BASE_URL }}
          AFFILIATE_LINKS: ${{ secrets.AFFILIATE_LINKS }}
          NEWSLETTER_URL: ${{ secrets.NEWSLETTER_URL }}
          GUMROAD_URL: ${{ secrets.GUMROAD_URL }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
        run: python -m aigent --mode build

      - name: Publish carousel slides to gh-pages
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          # Make sure the renderer wrote all 5 slides.
          for i in 1 2 3 4 5; do
            test -f "assets/daily_${i}.png" || { echo "slide ${i} missing"; exit 1; }
          done
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add -B gh-pages gh-pages-wt origin/gh-pages
          else
            git worktree add --orphan -b gh-pages gh-pages-wt
          fi
          for i in 1 2 3 4 5; do
            cp "assets/daily_${i}.png" "gh-pages-wt/daily_${i}.png"
          done
          cd gh-pages-wt
          git config user.email "actions@github.com"
          git config user.name "aigent Bot"
          git add daily_1.png daily_2.png daily_3.png daily_4.png daily_5.png
          git commit -m "carousel: $(date -u +%F)" || echo "no changes"
          git push origin gh-pages

      - name: Wait for GitHub Pages to serve new slides
        if: ${{ !inputs.dry_run }}
        run: sleep 60

      - name: Publish carousel to Instagram
        if: ${{ !inputs.dry_run }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_IMAGE_BASE_URL: ${{ secrets.PUBLIC_IMAGE_BASE_URL }}
          AFFILIATE_LINKS: ${{ secrets.AFFILIATE_LINKS }}
          NEWSLETTER_URL: ${{ secrets.NEWSLETTER_URL }}
          GUMROAD_URL: ${{ secrets.GUMROAD_URL }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
        run: python -m aigent --mode publish

      - name: Upload rendered carousel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-carousel
          path: |
            assets/daily_1.png
            assets/daily_2.png
            assets/daily_3.png
            assets/daily_4.png
            assets/daily_5.png
            assets/caption.txt
          if-no-files-found: ignore
