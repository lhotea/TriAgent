name: collect-insights

# Runs the morning after the daily post, so the newest one has had overnight
# to accumulate numbers, and re-polls recent posts because insights keep moving
# for days. Without this, every change to the hook or format is a guess.
#
# It also records the account itself — followers, and the share of reach that
# came from people who do not follow yet — in account.csv. The per-post numbers
# say which posts did well; only the follower count says whether the audience is
# actually growing, which is what the posts are for.

on:
  schedule:
    # 09:00 UTC. Reporting sooner mostly measures how fast the first few
    # followers happened to open the app. (GitHub starts scheduled runs late —
    # see daily-post.yml — so in practice this lands between midday and the
    # afternoon, which is later still.)
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write  # to publish the CSVs to gh-pages

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install TriAgent
        run: pip install -e .

      # The CSVs are the accumulated history. Pull the published copies first or
      # each run would start from empty and overwrite everything collected so
      # far — the merge is an upsert, but only over rows it can see.
      #
      # Each file is staged in a temp dir and moved only once git has produced
      # it, and a failure stops the run. Redirecting `git show` straight into the
      # target creates the file *before* git runs, so a failed show leaves a
      # 0-byte file that reads as "no history yet" — and the next step would then
      # publish a one-row CSV over months of data. A red run is recoverable; a
      # wiped history is not.
      - name: Fetch existing history
        run: |
          set -euo pipefail
          mkdir -p assets
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            for name in insights.csv account.csv; do
              if git cat-file -e "origin/gh-pages:${name}" 2>/dev/null; then
                git show "origin/gh-pages:${name}" > "$RUNNER_TEMP/${name}"
                mv "$RUNNER_TEMP/${name}" "assets/${name}"
              else
                echo "no ${name} history yet — starting a new file"
              fi
            done
          fi

      - name: Collect insights
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_MODE: ${{ vars.IG_API_MODE || 'instagram_login' }}
        run: python -m triagent --mode insights | tee summary.txt

      - name: Publish CSVs to gh-pages
        run: |
          set -euo pipefail
          test -f assets/insights.csv || { echo "nothing collected"; exit 1; }
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add -B gh-pages gh-pages-wt origin/gh-pages
          else
            git worktree add --orphan -b gh-pages gh-pages-wt
          fi
          cd gh-pages-wt
          git config user.email "actions@github.com"
          git config user.name "TriAgent Bot"
          # gh-pages has more than one writer — daily-post pushes the card and
          # the ledger there — so the remote can move between the fetch above
          # and the push below. Re-sync and re-apply the CSVs on top instead of
          # being rejected. These files are written only by this workflow, so
          # re-copying them over the latest remote loses nothing.
          for attempt in 1 2 3 4 5; do
            git fetch origin gh-pages 2>/dev/null || true
            if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
              git reset --hard origin/gh-pages
            fi
            cp ../assets/insights.csv insights.csv
            git add insights.csv
            if [ -f ../assets/account.csv ]; then
              cp ../assets/account.csv account.csv
              git add account.csv
            fi
            if git diff --cached --quiet; then
              echo "no changes"
              exit 0
            fi
            git commit -m "insights: $(date -u +%F)"
            if git push origin gh-pages; then
              exit 0
            fi
            echo "push raced with another writer (attempt ${attempt}); retrying"
            sleep $((attempt * 3))
          done
          echo "could not publish the CSVs after 5 attempts" >&2
          exit 1

      - name: Show ranking in the run summary
        if: always()
        run: |
          {
            echo '## Post performance and followers'
            echo '```'
            cat summary.txt 2>/dev/null || echo 'no summary produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: insights
          path: |
            assets/insights.csv
            assets/account.csv
          if-no-files-found: ignore
