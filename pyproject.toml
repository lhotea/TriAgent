[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aigent"
version = "0.1.0"
description = "Faceless Instagram channel that drops one AI tool a day as a carousel — affiliate + newsletter + Gumroad monetized."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.88.0",
    "feedparser>=6.0.11",
    "Pillow>=10.4.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.8.0",
    "tenacity>=9.0.0",
]

[project.scripts]
aigent = "aigent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
